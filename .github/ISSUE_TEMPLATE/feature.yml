name: Feature request
description: Propose a focused user or developer improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the user need rather than only the proposed control or API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: checkboxes
    id: boundaries
    attributes:
      label: Potential impact
      options:
        - label: Privacy or stored meeting data
        - label: Agent permissions or network access
        - label: Protocol or public API
        - label: Platform-specific packaging/lifecycle
