name: Build artifacts

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Validated Elsewise product version
        value: ${{ jobs.validate.outputs.version }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  UV_VERSION: "0.8.14"

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main for manual builds
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual artifact builds must run from main." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
      - run: uv sync --all-groups --frozen
      - run: npx playwright install --with-deps chromium
      - name: Validate GitHub workflows
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7
          ./actionlint .github/workflows/*.yml
      - run: make check
      - id: version
        shell: bash
        run: |
          version=$(uv run python scripts/version.py --check)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: npm ci
      - run: npm run build --workspace web
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/build-frozen.py
      - name: Build Python and browser-extension archives
        run: |
          uv build --out-dir dist/python
          npm run build --workspace extension
          uv run python scripts/build-extension-archives.py
          mkdir -p dist/packages
          cp dist/python/* dist/packages/
      - name: Install Linux packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/build-linux-packages.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Archive portable onedir
        run: tar -C dist/frozen -czf "dist/packages/Elsewise-${{ needs.validate.outputs.version }}-linux-x86_64.tar.gz" Elsewise
      - uses: actions/upload-artifact@v4
        with:
          name: platform-linux
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/build-frozen.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: ./scripts/build-windows-installer.ps1
      - name: Smoke-test installer and PATH cleanup
        shell: pwsh
        run: ./scripts/smoke-windows-installer.ps1 -InstallerPath "dist/packages/Elsewise-${{ needs.validate.outputs.version }}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-windows
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 3

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            artifact: platform-macos-arm64
          - runner: macos-15-intel
            artifact: platform-macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/build-frozen.py
      - run: scripts/build-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 3

  bundle:
    needs: [validate, linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: release-assets
          merge-multiple: true
      - name: Verify inventory and generate checksums
        run: python scripts/verify-release-assets.py release-assets --version "${{ needs.validate.outputs.version }}" --write-checksums
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
