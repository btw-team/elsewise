<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elsewise</title>
  </head>
  <body>
    <main class="popup">
      <header>
        <div>
          <p class="eyebrow" data-i18n="appName">Elsewise</p>
          <h1 id="platform" data-i18n="unsupportedPage">Unsupported page</h1>
        </div>
        <span id="daemon-badge" class="badge" data-i18n="unavailable"
          >Unavailable</span
        >
      </header>
      <dl class="status-grid">
        <div>
          <dt data-i18n="captureLabel">Capture</dt>
          <dd id="capture" data-i18n="disabled">Disabled</dd>
        </div>
        <div>
          <dt data-i18n="captionsLabel">Captions</dt>
          <dd id="captions" data-i18n="notDetected">Not detected</dd>
        </div>
        <div>
          <dt data-i18n="speakerLabel">Speaker</dt>
          <dd id="speaker" data-i18n="unknown">Unknown</dd>
        </div>
        <div>
          <dt data-i18n="bufferLabel">Buffer</dt>
          <dd id="buffer">0 pending · 0 dropped</dd>
        </div>
        <div>
          <dt data-i18n="sessionLabel">Session</dt>
          <dd id="session" data-i18n="none">None</dd>
        </div>
        <div>
          <dt data-i18n="lastEventLabel">Last event</dt>
          <dd id="last-event" data-i18n="never">Never</dd>
        </div>
      </dl>
      <p id="buffer-warning" class="buffer-warning" role="status"></p>
      <p id="hint" class="hint" data-i18n="hintUnsupported">
        Open Google Meet, Microsoft Teams, or Zoom to begin.
      </p>
      <div class="actions">
        <button id="toggle" class="primary" data-i18n="enableCapture" disabled>
          Enable capture
        </button>
        <button
          id="open-side-panel"
          class="gui-action"
          data-i18n="openSidePanel"
        >
          Open side panel
        </button>
        <button id="open-new-tab" class="gui-action" data-i18n="openNewTab">
          Open in new tab
        </button>
      </div>
      <form id="pairing" class="pairing">
        <label for="token" data-i18n="pairingToken">Pairing token</label>
        <div>
          <input id="token" type="password" autocomplete="off" /><button
            data-i18n="save"
          >
            Save
          </button>
        </div>
      </form>
      <p id="notice" class="notice" aria-live="polite"></p>
      <section class="debug-section">
        <p class="debug-title" data-i18n="debug">Debug</p>
        <div class="debug-actions">
          <button id="dump" data-i18n="dumpCaptionDom">Dump caption DOM</button>
          <button id="copy" data-i18n="copyDiagnostics">
            Copy diagnostics
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/popup/index.ts"></script>
  </body>
</html>
