[project]
name = "elsewise"
version = "0.1.2"
description = "Open-source local companion for browser meeting captions and AI-assisted workflows"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "BTW Team" }]
maintainers = [{ name = "BTW Team" }]
keywords = ["captions", "meetings", "codex", "claude", "browser-extension"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "certifi>=2025.8",
  "customtkinter>=5.2,<6",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "packaging>=24,<27",
  "platformdirs>=4.3,<5",
  "pillow>=11.3,<13",
  "psutil>=7.0,<8",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.17,<2",
  "pyinstaller>=6.15,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-psutil>=7.0,<8",
]

[project.scripts]
elsewise = "elsewise.cli:main"
elsewise-gui = "elsewise.launcher.app:main"
elsewise-server = "elsewise.runtime.server_runner:main"

[project.urls]
Homepage = "https://github.com/btw-team/elsewise"
Repository = "https://github.com/btw-team/elsewise"
Issues = "https://github.com/btw-team/elsewise/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/elsewise"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "elsewise/web_dist"
"web/src/assets/elsewise-logo-dark.png" = "elsewise/assets/elsewise-logo-dark.png"
"web/src/assets/elsewise-logo-light.png" = "elsewise/assets/elsewise-logo-light.png"
"shared/theme-tokens.json" = "elsewise/assets/theme-tokens.json"

[tool.hatch.build.targets.sdist]
exclude = ["/extra"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"
"web/src/assets/elsewise-logo-dark.png" = "web/src/assets/elsewise-logo-dark.png"
"web/src/assets/elsewise-logo-light.png" = "web/src/assets/elsewise-logo-light.png"
"shared/theme-tokens.json" = "shared/theme-tokens.json"

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"
markers = ["integration: tests that cross component or transport boundaries"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "server/src"
