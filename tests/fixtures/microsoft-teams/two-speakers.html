      <div data-tid="closed-caption-v2-virtual-list-content">
        <div role="list">
          <div role="listitem">
            <div data-tid="closed-captions-v2-items-renderer"></div>
            <div>
              <span data-tid="author">Speaker A</span
              ><span data-tid="closed-caption-text">First speaker text.</span>
            </div>
          </div>
          <div role="listitem">
            <div data-tid="closed-captions-v2-items-renderer"></div>
            <div>
              <span data-tid="author">Speaker B</span
              ><span data-tid="closed-caption-text">Second speaker text.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
